<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descritivo Técnico — Maurinho Rigging</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TEMA DA TELA (DARK MODE)
   ========================================================================== */
:root {
  --bg: #09090b;
  --panel: #18181b;
  --panel-hover: #27272a;
  --line: #27272a;
  --text: #f4f4f5;
  --muted: #a1a1aa;
  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --radius: 8px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

header {
  border-bottom: 1px solid var(--line);
  padding: 40px 20px 30px;
  background: var(--panel);
}

.header-inner, main, .export-bar {
  max-width: 900px;
  margin: 0 auto;
}

.back-link {
  display: inline-flex;
  align-items: center;
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: color 0.2s;
}

.back-link:hover { color: var(--accent); }

.tag {
  margin: 24px 0 8px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

h1 {
  margin: 0;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

header p:last-child {
  color: var(--muted);
  line-height: 1.6;
  margin: 12px 0 0;
  font-size: 15px;
}

.export-bar {
  padding: 24px 20px 0;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

.btn {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 20px;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.btn:hover {
  background: var(--panel-hover);
  border-color: var(--muted);
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn.primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

main { padding: 24px 20px 60px; }

.status {
  color: var(--muted);
  font-size: 14px;
  margin: 0 0 24px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.status::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--accent);
  border-radius: 50%;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 24px;
  padding: 24px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

.section-title {
  margin: 0 0 16px;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
}

.section-title span {
  background: rgba(59, 130, 246, 0.1);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 4px;
  margin-right: 12px;
  font-size: 12px;
}

.empty {
  color: var(--muted);
  font-size: 14px;
  font-style: italic;
}

.text {
  white-space: pre-wrap;
  font-family: 'JetBrains Mono', Consolas, monospace;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
}

/* ==========================================================================
   ESTILO DE IMPRESSÃO / PDF (CLEAN & PROFESSIONAL)
   ========================================================================== */
#printReport { display: none; }

@media print {
  @page { size: A4; margin: 15mm 15mm 20mm 15mm; }
  
  body {
    background: #ffffff;
    color: #0f172a;
    font-family: 'Inter', Helvetica, Arial, sans-serif;
  }
  
  header, .export-bar, main { display: none !important; }
  #printReport { display: block !important; }
  
  .print-page {
    width: 100%;
    font-size: 9.5pt;
    line-height: 1.4;
  }

  /* Capa super clean */
  .print-cover {
    border-bottom: 2px solid #0f172a;
    padding: 0 0 16px;
    margin-bottom: 24px;
  }
  
  .print-cover-tag {
    font-size: 8pt;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  
  .print-cover h1 {
    font-size: 24pt;
    line-height: 1.1;
    margin: 0 0 6px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #0f172a;
  }
  
  .print-cover p {
    margin: 0;
    color: #475569;
    font-size: 11pt;
  }

  .print-section {
    margin: 0 0 24px;
    break-inside: auto;
  }
  
  .print-section-title {
    font-size: 14pt;
    font-weight: 800;
    margin: 0 0 16px;
    padding: 0 0 8px;
    border-bottom: 1px solid #cbd5e1;
    color: #0f172a;
    display: flex;
    align-items: center;
  }
  
  .print-section-title .num {
    background: #0f172a;
    color: #fff;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10pt;
    margin-right: 10px;
  }

  /* Caixas de conteúdo e grupos */
  .print-box {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-left: 3px solid #cbd5e1;
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 12px;
    break-inside: avoid;
  }
  
  .print-box h3, .print-group h3 {
    font-size: 10pt;
    margin: 0 0 8px;
    font-weight: 700;
    text-transform: uppercase;
    color: #334155;
    letter-spacing: 0.03em;
  }

  /* Painel Escuro para Resumos Especiais */
  .print-box.dark {
    background: #0f172a;
    color: #f8fafc;
    border: none;
    border-left: 3px solid #3b82f6;
  }
  
  .print-box.dark h3 {
    color: #94a3b8;
  }
  
  .print-box.dark .print-line b {
    color: #fff;
  }

  .print-line {
    margin: 4px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  
  .print-line b {
    font-weight: 600;
    color: #0f172a;
  }

  .print-group {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 12px;
    break-inside: avoid;
  }
  
  .print-bullets { margin: 0; padding-left: 20px; }
  .print-bullets li { margin: 4px 0; padding-left: 4px; }
  .print-bullets li::marker { color: #94a3b8; }

  /* Tabelas Clean */
  .print-table {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0 16px;
    font-size: 9pt;
    break-inside: auto;
  }
  
  .print-table th {
    text-align: left;
    padding: 8px 10px;
    font-size: 8pt;
    text-transform: uppercase;
    font-weight: 700;
    color: #475569;
    border-bottom: 1px solid #cbd5e1;
  }
  
  .print-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #f1f5f9;
    vertical-align: top;
  }
  
  .print-table tr:nth-child(even) td { background: #f8fafc; }
  .print-table tr { break-inside: avoid; }
  .print-table .qty { text-align: right; white-space: nowrap; font-weight: 600; }

  .print-note {
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 6px;
    padding: 12px;
    color: #64748b;
    font-size: 9pt;
    break-inside: avoid;
    text-align: center;
  }

  .print-footer {
    margin-top: 30px;
    border-top: 1px solid #e2e8f0;
    padding-top: 10px;
    color: #94a3b8;
    font-size: 8pt;
    display: flex;
    justify-content: space-between;
    font-weight: 500;
  }

  .print-page-break { break-before: page; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="back-link" href="index.html">← Voltar para painel inicial</a>
    <p class="tag">Maurinho Rigging</p>
    <h1>Descritivo Técnico</h1>
    <p>Reúne as especificações de pré-produção de som, luz e vídeo geradas nas calculadoras para conferência rápida e exportação em documento PDF.</p>
  </div>
</header>

<div class="export-bar">
  <button class="btn" id="btnAtualizar">Atualizar Dados</button>
  <button class="btn primary" id="btnPDF">Exportar PDF</button>
</div>

<main>
  <p class="status" id="status"></p>
  
  <section class="card">
    <p class="section-title"><span>01</span> ÁUDIO / PA</p>
    <div class="text" id="som"></div>
  </section>
  
  <section class="card">
    <p class="section-title"><span>02</span> ILUMINAÇÃO</p>
    <div class="text" id="luz"></div>
  </section>
  
  <section class="card">
    <p class="section-title"><span>03</span> VÍDEO / PAINEL DE LED</p>
    <div class="text" id="video"></div>
  </section>
</main>

<div id="printReport"></div>

<script>
const keys = ['som', 'luz', 'video'];
const titles = {
  som: 'Sistema de Áudio',
  luz: 'Sistema de Iluminação',
  video: 'Vídeo / Painel de LED'
};

function esc(v) {
  return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function cleanLine(l) {
  return l.replace(/^\s*[-•]\s*/, '').trim();
}

function qtyMatch(l) {
  return l.match(/^(\d+(?:[.,]\d+)?)x\s+(.+?)\s+—\s+(.+)$/i);
}

function lineHtml(l) {
  let x = cleanLine(l);
  x = x.replace(/^(Caixas|Equipamentos|Consumo|Cabeamento|Peso caixas|Peso dos equipamentos|Peso das caixas|Peso total do sistema|Peso suspenso considerado|Peso do conjunto|Suspensão|Suspenso|Voado\/suspenso|Rigging|Distribuição|Talhas|Chapas|Contrapesos|Potência|Corrente estimada|Parâmetros|Saídas físicas|Entradas físicas|Buses|Mesa de som|Mesa de luz|Total de circuitos AC|Potência total considerada|Peso total considerado|Sugestão calculada|Cabos de energia|Cabos de sinal RJ45|Total de portas RJ45|Área total|Pixel pitch|Configuração|Modo|Estrutura|JUMPS|CASES|Dimensão informada)\s*:/i, (m) => `<b>${esc(m.slice(0, -1))}:</b>`);
  return x;
}

function parseBlocks(text) {
  const lines = text.split(/\r?\n/).map(x => x.trimEnd());
  const blocks = [];
  let current = null;
  
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) continue;
    if (/^DESCRITIVO\s*[—-]/i.test(l)) continue;
    
    const isHeading = /^[A-ZÁÀÂÃÉÊÍÓÔÕÚÇ0-9\s&\/+().–—-]{5,}$/.test(l) && !/^\d+(?:[.,]\d+)?\s*(?:W|KG|M|A|KVA)/i.test(l);
    
    if (isHeading) {
      current = { title: l.replace(/^\d+\.\s*/, ''), lines: [] };
      blocks.push(current);
    } else if (current) {
      current.lines.push(l);
    }
  }
  return blocks;
}

function inventoryTable(lines) {
  const rows = lines.map(cleanLine).map(qtyMatch).filter(Boolean);
  if (rows.length < 2) return '';
  
  return `<table class="print-table">
            <thead>
              <tr>
                <th>Modelo / Equipamento</th>
                <th>Especificação</th>
                <th class="qty">Qtd</th>
                <th>Transporte</th>
              </tr>
            </thead>
            <tbody>` +
    rows.map(m => `<tr>
                     <td>${esc(m[2].split(' — ')[0])}</td>
                     <td>${esc(m[3])}</td>
                     <td class="qty">${esc(m[1])}x</td>
                     <td>${esc(m[3].match(/(?:\d+\s*cases?|\d+\s*case|sem case|\(.*?\/case\))/i)?.[0] || '—'}</td>
                   </tr>`).join('') +
    `</tbody></table>`;
}

function renderSection(key, text, index) {
  const blocks = parseBlocks(text); 
  let html = `<section class="print-section ${index > 0 ? 'print-page-break' : ''}">
                <h2 class="print-section-title">
                  <span class="num">${String(index + 1).padStart(2, '0')}</span> ${esc(titles[key])}
                </h2>`;
                
  if (!blocks.length) {
    return html + `<div class="print-note">Nenhum descritivo preenchido nesta área.</div></section>`;
  }
  
  for (const b of blocks) {
    const title = b.title.replace(/^\d+\.\s*/, '').trim();
    const inv = inventoryTable(b.lines);
    
    if (inv) {
      html += `<h3 style="font-size:10pt; font-weight:700; margin:14px 0 6px; color:#334155; text-transform:uppercase;">${esc(title)}</h3>${inv}`;
      continue;
    }
    
    const groupLike = b.lines.some(x => /^\s*(Caixas|Equipamentos):/i.test(x)) && b.lines.length >= 3;
    
    if (groupLike) {
      html += `<div class="print-group">
                 <h3>${esc(title)}</h3>
                 <ul class="print-bullets">
                   ${b.lines.map(x => `<li>${lineHtml(x)}</li>`).join('')}
                 </ul>
               </div>`;
      continue;
    }
    
    const isSummary = /RESUMO|ENERGIA|CIRCUITOS|DELAY|MESA|PROCESSADORAS|SINAL|PIXEL|ESTRUTURA|MONTAGEM|PAINEL|CASES|JUMPS/i.test(title);
    
    if (isSummary) {
      const isDark = /RESUMO/i.test(title) ? 'dark' : '';
      html += `<div class="print-box ${isDark}">
                 <h3>${esc(title)}</h3>
                 ${b.lines.map(x => `<div class="print-line">${lineHtml(x)}</div>`).join('')}
               </div>`;
    } else {
      html += `<div class="print-box">
                 <h3>${esc(title)}</h3>
                 ${b.lines.map(x => `<div class="print-line">${lineHtml(x)}</div>`).join('')}
               </div>`;
    }
  }
  return html + '</section>';
}

function buildPrint() {
  const report = document.getElementById('printReport');
  let available = 0; 
  let body = '';
  
  keys.forEach((k, i) => {
    const v = localStorage.getItem('descritivo_' + k); 
    if (v) {
      available++;
      body += renderSection(k, v, i);
    }
  });
  
  report.innerHTML = `
    <div class="print-page">
      <div class="print-cover">
        <div class="print-cover-tag">Maurinho Rigging</div>
        <h1>Descritivo Técnico</h1>
        <p>Especificações consolidadas de infraestrutura, equipamentos, energia e montagem.</p>
      </div>
      ${body || '<div class="print-note">Nenhum descritivo disponível. Utilize as calculadoras para gerar os dados antes de exportar o PDF.</div>'}
      <div class="print-footer">
        <span>Documento gerado pelo sistema integrado Maurinho Rigging</span>
        <span>Áreas preenchidas: ${available}/3</span>
      </div>
    </div>`;
}

function carregar() {
  let count = 0;
  for (const key of keys) {
    const el = document.getElementById(key);
    const v = localStorage.getItem('descritivo_' + key);
    if (v) {
      el.textContent = v;
      count++;
    } else {
      el.innerHTML = '<span class="empty">Nenhum descritivo disponível em cache para esta área.</span>';
    }
  }
  document.getElementById('status').innerHTML = `<b>${count} de 3</b> descritivos integrados. Pronto para visualização ou exportação.`;
  buildPrint();
}

document.getElementById('btnAtualizar').onclick = carregar;
document.getElementById('btnPDF').onclick = () => {
  buildPrint();
  window.print();
};

window.addEventListener('storage', carregar);
carregar();
</script>
</body>
</html>
